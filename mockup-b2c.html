<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Esboço · B2C 8 closers (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Bruta Pro";src:local("Bruta Pro Compressed ExtraBold"),url("fonts/brutaprocompressed-extrabold.otf") format("opentype");font-weight:100 900;font-display:swap}
  :root{
    --bg:#0b0b0e;--bg-2:#101014;--panel:#141417;--panel-2:#1a1a20;--line:#26262c;
    --ink:#f4f4f6;--muted:#c4c4cd;--dim:#8a8a93;--orange:#ff6a1a;--blue:#5aa9ff;
    --now:#FF6A00;--done:#3AAF3A;--sched:#FFB703;--next:#0f5132;--miss:#ff5a5a;
    --num:'Bruta Pro','Archivo',sans-serif;--sans:'Archivo',system-ui,sans-serif;--inter:'Inter',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(1200px 600px at 85% -10%,rgba(255,106,26,.12),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(90,169,255,.10),transparent 55%),var(--bg);-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 26px;border-bottom:1px solid var(--line);flex:0 0 auto;background:linear-gradient(180deg,var(--bg-2),transparent)}
  .brand{display:flex;align-items:center;gap:14px}
  .dot{width:13px;height:13px;border-radius:50%;background:var(--now);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,26,.55)}70%{box-shadow:0 0 0 14px rgba(255,106,26,0)}100%{box-shadow:0 0 0 0 rgba(255,106,26,0)}}
  h1{font-family:var(--num);font-weight:700;font-size:28px;letter-spacing:.10em;text-transform:uppercase;line-height:1}
  .sub{color:var(--muted);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;margin-top:4px}
  .flag{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:right}
  .flag b{color:var(--sched)}

  /* chips (métricas) */
  .kpis{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;flex:1 1 auto;padding:0 16px}
  .chip{display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px 6px 10px;border-left:4px solid var(--c)}
  .chip b{font-family:var(--num);font-weight:700;font-size:24px;line-height:.85;color:var(--c);font-variant-numeric:tabular-nums}
  .chip span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.1;white-space:normal;overflow-wrap:anywhere;max-width:72px}

  /* grade 4x2 de closers */
  .grid{flex:1 1 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px;padding:12px 26px 16px;overflow:hidden}
  .card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;min-height:0}
  .card.is-now{border-color:rgba(255,106,26,.55);box-shadow:0 0 30px rgba(255,106,26,.14)}
  .who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .who .name{font-family:var(--inter);font-weight:700;font-size:20px;line-height:1.05}
  .badge{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .badge .d{width:7px;height:7px;border-radius:50%}
  .badge.now{color:var(--now);background:rgba(255,106,26,.14)} .badge.now .d{background:var(--now)}
  .badge.free{color:var(--muted);background:rgba(196,196,205,.10)} .badge.free .d{background:var(--dim)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
  .stat{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:9px;padding:6px 3px;text-align:center}
  .stat .n{font-family:var(--num);font-weight:700;font-size:26px;line-height:.85;color:var(--c)}
  .stat .t{color:var(--muted);font-size:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-top:3px}
  .agenda{flex:1 1 auto;display:flex;flex-direction:column;gap:5px;overflow:hidden;min-height:0}
  .appt{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;background:rgba(0,0,0,.28);border-left:4px solid var(--c);flex:1 1 0;min-height:0;overflow:hidden}
  .appt .t{font-family:var(--inter);font-weight:700;font-size:15px;color:var(--c);font-variant-numeric:tabular-nums;flex:0 0 auto}
  .appt .c{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
  .appt .g{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c);white-space:nowrap;flex:0 0 auto}
  /* densidades */
  .agenda.compact .appt{gap:8px;padding:4px 8px} .agenda.compact .appt .t{font-size:14px} .agenda.compact .appt .c{font-size:12px}
  .agenda.dense{gap:4px} .agenda.dense .appt{padding:3px 8px} .agenda.dense .appt .t{font-size:13px} .agenda.dense .appt .c{font-size:11.5px} .agenda.dense .appt .g{font-size:9px}
  .agenda.grade{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:5px 8px}
  .agenda.grade .appt{padding:3px 8px} .agenda.grade .appt .t{font-size:12px} .agenda.grade .appt .c{font-size:11px} .agenda.grade .appt .g{font-size:8.5px}
  footer{position:fixed;right:14px;bottom:7px;color:var(--dim);font-size:10.5px}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><div><h1>Agenda de Reuniões</h1><div class="sub">B2C · 8 closers · ESBOÇO</div></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="flag">Mockup · <b>dados fictícios</b><br>não é produção</div>
</header>
<main class="grid" id="grid"></main>
<footer>Esboço para validação · B2C com 8 closers (4×2)</footer>

<script>
const CLOSERS=["Amanda de Oliveira","Mayda Quadros","João Paulo da Silveira Araújo","Willker Santos Belous","Gabrielly Milani da Silva","Camila Fay","Luiza Rodriguez","Tércio Ferreira"];
const QTD=[12,9,10,8,11,7,6,9]; // reuniões por closer (pesado, p/ estressar o layout)
const CT=["Rafael Souza","Bianca Lima","Diego Prado","Helena Dias","Otávio Reis","Paula Nunes","Sérgio Mota","Lívia Torres","André Melo","Tiago Farias","Isabela Cruz","Gustavo Pinto","Ana Reis","Caio Melo"];
const ST=["REALIZADA","REALIZADA","AGORA","FUTURA","NO_SHOW","A_REGISTRAR","REPROGRAMADA","CANCELADA","REALIZADA","FUTURA"];
const VIS={REALIZADA:{c:"var(--done)",g:"Realizada"},AGORA:{c:"var(--now)",g:"Agora"},FUTURA:{c:"var(--sched)",g:"Agendada"},NO_SHOW:{c:"var(--miss)",g:"No-show"},A_REGISTRAR:{c:"var(--muted)",g:"A registrar"},REPROGRAMADA:{c:"var(--blue)",g:"Reprogramada"},CANCELADA:{c:"var(--dim)",g:"Cancelada"}};

const closers=CLOSERS.map((nome,i)=>{
  const n=QTD[i], reun=[];
  for(let k=0;k<n;k++){
    const min=9*60+((i*41+k*38)%570), h=String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');
    reun.push({hora:h, contato:CT[(i*5+k*3)%CT.length], status:ST[(i*3+k*2)%ST.length]});
  }
  reun.sort((a,b)=>a.hora.localeCompare(b.hora));
  return {nome, reun};
});

// chips agregados
const agg={agendadas:0,realizadas:0,agora:0,futuras:0,perdidas:0,pendentes:0,reprog:0,cancel:0};
closers.forEach(c=>c.reun.forEach(m=>{agg.agendadas++;
  if(m.status==="REALIZADA")agg.realizadas++;else if(m.status==="AGORA")agg.agora++;else if(m.status==="FUTURA")agg.futuras++;
  else if(m.status==="NO_SHOW")agg.perdidas++;else if(m.status==="A_REGISTRAR")agg.pendentes++;else if(m.status==="REPROGRAMADA")agg.reprog++;else if(m.status==="CANCELADA")agg.cancel++;}));
const chips=[["Agendadas",agg.agendadas,"var(--sched)"],["Realizadas",agg.realizadas,"var(--done)"],["Em andamento",agg.agora,"var(--now)"],["Futuras",agg.futuras,"var(--next)"],["No-show",agg.perdidas,"var(--miss)"],["A registrar",agg.pendentes,"var(--muted)"],["Reprog.",agg.reprog,"var(--blue)"],["Canceladas",agg.cancel,"var(--dim)"]];
document.getElementById('kpis').innerHTML=chips.map(([l,n,c])=>`<div class="chip" style="--c:${c}"><b>${n}</b><span>${l}</span></div>`).join('');

document.getElementById('grid').innerHTML=closers.map(c=>{
  const r={ag:c.reun.length,re:0,ao:0,fu:0,no:0};
  c.reun.forEach(m=>{if(m.status==="REALIZADA")r.re++;else if(m.status==="AGORA")r.ao++;else if(m.status==="FUTURA")r.fu++;else if(m.status==="NO_SHOW")r.no++;});
  const dens=c.reun.length>=9?" grade":(c.reun.length>=7?" dense":(c.reun.length>=5?" compact":""));
  const linhas=c.reun.map(m=>{const v=VIS[m.status];return `<div class="appt" style="--c:${v.c}"><span class="t">${m.hora}</span><span class="c">${m.contato}</span><span class="g">${v.g}</span></div>`;}).join('');
  return `<div class="card ${r.ao?'is-now':''}">
    <div class="who"><div class="name">${c.nome}</div><div class="badge ${r.ao?'now':'free'}"><span class="d"></span>${r.ao?'Ocupado':'Disponível'}</div></div>
    <div class="stats">
      <div class="stat" style="--c:var(--sched)"><div class="n">${r.ag}</div><div class="t">Agend.</div></div>
      <div class="stat" style="--c:var(--done)"><div class="n">${r.re}</div><div class="t">Realiz.</div></div>
      <div class="stat" style="--c:var(--now)"><div class="n">${r.ao}</div><div class="t">Agora</div></div>
      <div class="stat" style="--c:var(--sched)"><div class="n">${r.fu}</div><div class="t">Futuras</div></div>
      <div class="stat" style="--c:var(--miss)"><div class="n">${r.no}</div><div class="t">No-show</div></div>
    </div>
    <div class="agenda${dens}">${linhas}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
